<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Compress Image to 20KB</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292b2a;
      background: #f8faf9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main {
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 48px);
      border: 1.5px solid #353a37;
      border-radius: 8px;
      background: #fff;
      box-shadow: 5px 5px 0 #dce4df;
    }
    .status { margin: 0 0 16px; font-size: 0.875rem; font-weight: 750; color: #616663; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.15; }
    .message { margin: 20px 0 28px; color: #616663; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 13px 18px;
      border: 1.5px solid #353a37;
      border-radius: 6px;
      background: #ffdf53;
      color: #292b2a;
      font-weight: 750;
      line-height: 1.5;
      text-decoration: none;
      box-shadow: 3px 3px 0 #353a37;
    }
    a:hover { background: #ffe778; }
    a:focus-visible { outline: 3px solid #287db3; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="status">404 — Page not found</p>
    <h1>We can’t find this page.</h1>
    <p class="message">The page may have moved, or the address may be incorrect. You can return to the image compressor below.</p>
    <a href="/">Back to the compressor</a>
  </main>
</body>
</html>
